<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个关于 Web 开发、技术与开发者生活的个人博客。聚焦 React、TypeScript 及现代 Web 开发，分享前端工程化、组件设计与实战经验。" />
    <link rel="canonical" href="https://blog.octkun.site/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="陈坤的博客" />
    <meta property="og:title" content="陈坤的博客" />
    <meta property="og:description" content="一个关于 Web 开发、技术与开发者生活的个人博客。" />
    <meta property="og:url" content="https://blog.octkun.site/" />
    <meta property="og:image" content="https://blog.octkun.site/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap"
      rel="stylesheet"
    />
    <!-- title 与 og/canonical 占位：预渲染脚本（scripts/prerender.mjs）会按路由替换 -->
    <title>陈坤的博客</title>
    <!-- 防闪白：在任何样式/脚本加载前，根据用户偏好提前设置 data-theme，
         避免暗色用户刷新瞬间看到一帧白屏。两态逻辑：有记录用手动值，否则跟随系统。 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
